# Builds Mori on native runners and publishes a GitHub Release from a tag.
#
# - Pushing a tag vX.Y.Z that points at a commit on main:
#     1. every platform runs the checks and tests and builds its installers;
#     2. the release job (only if every build succeeded) renames the files,
#        writes SHA256SUMS.txt, creates "Mori vX.Y.Z" as a draft with
#        docs/releases/vX.Y.Z.md as notes, uploads everything, re-downloads
#        it to verify the checksums, and only then publishes the release.
# - "Run workflow" (workflow_dispatch) runs the same checks and builds and
#   keeps the files as workflow artifacts. It never creates a release.
#
# Nothing runs for ordinary pushes or pull requests. Signing secrets are
# optional, only exist in tag/dispatch runs, and only reach the macOS build
# step (see docs/releasing.md).

name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: "1.99.0"
  NODE_VERSION: "24"

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS_arm64
            runner: macos-15
            bundles: app,dmg
          - label: macOS_x64
            runner: macos-15-intel
            bundles: app,dmg
          - label: Windows_x64
            runner: windows-2025
            bundles: nsis,msi
          - label: Linux_x64
            runner: ubuntu-22.04
            bundles: deb,appimage
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the exact ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Read the app version
        id: version
        run: |
          version=$(node -p 'require("./package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match the app version v$version"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::Tag $GITHUB_REF_NAME does not point at a commit on main"
              exit 1
            fi
          fi

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev build-essential file patchelf

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"
          rustc --version

      - name: Install dependencies (from lockfiles)
        run: |
          npm ci
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml

      - name: Type check
        run: npm run typecheck

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests (unit, sandboxed worker, persistence, version)
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build (macOS)
        if: runner.os == 'macOS'
        env:
          # All optional. Empty when the secrets are not configured.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          args=(--bundles ${{ matrix.bundles }})
          if [[ -n "$APPLE_SIGNING_IDENTITY" ]]; then
            # Replace the ad-hoc identity in tauri.conf.json with the Developer ID.
            printf '{"bundle":{"macOS":{"signingIdentity":%s}}}' \
              "$(node -p 'JSON.stringify(process.env.APPLE_SIGNING_IDENTITY)')" > "$RUNNER_TEMP/signing.json"
            args+=(--config "$RUNNER_TEMP/signing.json")
          else
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          npx tauri build "${args[@]}" -- --locked

      - name: Build (Windows, Linux)
        if: runner.os != 'macOS'
        run: npx tauri build --bundles ${{ matrix.bundles }} -- --locked

      - name: Collect and verify artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
          LABEL: ${{ matrix.label }}
        run: |
          bundle=src-tauri/target/release/bundle
          out="dist-release"
          mkdir -p "$out"
          take() { # take <glob> <new name>: exactly one match, copied under a clear name
            shopt -s nullglob; local m=($1); shopt -u nullglob
            [[ ${#m[@]} -eq 1 ]] || { echo "::error::Expected one file for $1, found ${#m[@]}"; exit 1; }
            cp "${m[0]}" "$out/$2"
          }
          base="Mori_${VERSION}_${LABEL}"
          case "$RUNNER_OS" in
            macOS)
              app="$bundle/macos/Mori.app"
              codesign --verify --deep --strict --verbose=2 "$app"
              [[ "$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")" == "$VERSION" ]]
              arch=$(lipo -archs "$app/Contents/MacOS/mori"); echo "architecture: $arch"
              [[ "$LABEL" == macOS_arm64 && "$arch" == arm64 || "$LABEL" == macOS_x64 && "$arch" == x86_64 ]]
              take "$bundle/dmg/*.dmg" "$base.dmg"
              hdiutil verify "$out/$base.dmg"
              ;;
            Windows)
              take "$bundle/msi/*.msi" "$base.msi"
              take "$bundle/nsis/*-setup.exe" "$base-setup.exe"
              ;;
            Linux)
              take "$bundle/appimage/*.AppImage" "$base.AppImage"
              take "$bundle/deb/*.deb" "$base.deb"
              dpkg-deb --info "$out/$base.deb"
              [[ "$(dpkg-deb --field "$out/$base.deb" Version)" == "$VERSION" ]]
              file "$out/$base.AppImage" | grep -q ELF
              ;;
          esac
          ls -l "$out"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mori-${{ steps.version.outputs.version }}-${{ matrix.label }}
          path: dist-release/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out the release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: docs/releases

      - name: Download every platform's artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mori-${{ needs.build.outputs.version }}-*
          merge-multiple: true
          path: dist-release

      - name: Write SHA256SUMS.txt
        working-directory: dist-release
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the release (draft until every file is uploaded)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/$TAG.md"
          [[ -f "$notes" ]] || { echo "::error::Missing $notes"; exit 1; }
          gh release create "$TAG" dist-release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "Mori $TAG" \
            --notes-file "$notes"

      - name: Verify the uploaded files against SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir verify && cd verify
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"
          sha256sum -c SHA256SUMS.txt
          [[ "$(ls | wc -l)" == "$(ls ../dist-release | wc -l)" ]]

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
