[package]
name = "mori"
version = "1.0.0"
description = "Mori — a tiny offline file & media browser for external drives"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
unicode-normalization = "0.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Same version Tauri/wry already use; only for terminating a hung WebKit content process.
objc2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.dev.package."*"]
# Image decoding is painfully slow unoptimised; keep deps fast even in dev.
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# Unwind (not abort): a panic in a background thread must never take the
# whole app down; threads are wrapped in catch_unwind instead.
panic = "unwind"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif"] }
